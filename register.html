<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:30px;
            width:300px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#1e3a8a;
            color:white;
            border:none;
            cursor:pointer;
        }

        h2{
            text-align:center;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Register</h2>

    <input type="email" id="email" placeholder="Enter Email">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="register()">Register</button>
</div>

<script>

function register(){

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    fetch("register.php",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:"email="+email+"&password="+password
    })

    .then(res => res.text())

    .then(data => {
        alert(data);
    });

}

</script>

</body>
</html>
